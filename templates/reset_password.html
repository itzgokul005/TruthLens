{% extends "base.html" %}
{% block title %}Reset Password — TruthLens.AI{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 bg-[#f9fafb] dark:bg-[#030712]">
  <div class="relative w-full max-w-md overflow-hidden rounded-2xl glass-effect-strong border border-white/20 dark:border-white/5 shadow-2xl p-6 sm:p-8">
    <div class="absolute -top-12 -left-12 w-32 h-32 rounded-full bg-blue-500/10 blur-2xl pointer-events-none"></div>
    <div class="absolute -bottom-12 -right-12 w-32 h-32 rounded-full bg-purple-500/10 blur-2xl pointer-events-none"></div>

    <div class="flex items-center gap-2 mb-6">
      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-purple-600">
        <i data-lucide="shield-alert" class="text-white" style="width:16px;height:16px"></i>
      </div>
      <span class="font-display text-lg font-black tracking-tight italic text-zinc-900 dark:text-white uppercase">TRUTHLENS<span class="text-blue-600">.AI</span></span>
    </div>

    <h1 class="font-display text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 dark:from-blue-400 dark:to-purple-400 bg-clip-text text-transparent">Synchronize Password</h1>
    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-6">Set a new security signature key for your vault below.</p>

    <div id="reset-error-banner" class="hidden items-start gap-2.5 p-3 rounded-lg bg-red-50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-700 dark:text-red-300 text-xs mb-4">
      <i data-lucide="alert-circle" class="shrink-0 mt-0.5" style="width:16px;height:16px"></i>
      <span id="reset-error-text"></span>
    </div>
    <div id="reset-success-banner" class="hidden items-start gap-2.5 p-3 rounded-lg bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 text-emerald-700 dark:text-emerald-300 text-xs mb-4">
      <i data-lucide="check" class="shrink-0 mt-0.5" style="width:16px;height:16px"></i>
      <span id="reset-success-text"></span>
    </div>

    <form id="reset-password-form" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">New Security Signature Key</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 dark:text-slate-500">
            <i data-lucide="lock" style="width:15px;height:15px"></i>
          </span>
          <input id="reset-input-password" type="password" placeholder="••••••••" class="w-full pl-9 pr-3 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 focus:outline-none focus:ring-1 focus:ring-blue-500 text-slate-900 dark:text-white" />
        </div>
      </div>
      <button id="reset-submit-btn" type="submit" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white text-xs font-semibold rounded-lg shadow-md transition-all duration-200 flex items-center justify-center gap-1.5 disabled:opacity-50">
        <span id="reset-submit-spinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        <span id="reset-submit-label">Confirm New Password</span>
      </button>
    </form>

    <a href="{{ url_for('main.index') }}" class="block text-center text-xs text-slate-500 hover:text-slate-700 dark:text-slate-400 mt-5 underline">Back to TruthLens</a>
  </div>
</div>

<script>
  (function () {
    const token = {{ token | tojson }};
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute("content");
    const form = document.getElementById("reset-password-form");
    const errorBanner = document.getElementById("reset-error-banner");
    const successBanner = document.getElementById("reset-success-banner");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorBanner.classList.add("hidden");
      successBanner.classList.add("hidden");
      const password = document.getElementById("reset-input-password").value;

      document.getElementById("reset-submit-btn").disabled = true;
      document.getElementById("reset-submit-spinner").classList.remove("hidden");
      document.getElementById("reset-submit-label").textContent = "Synchronizing...";

      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
          body: JSON.stringify({ token: token, password: password }),
        });
        const data = await res.json();
        if (!res.ok) {
          document.getElementById("reset-error-text").textContent = data.error || "Reset failed.";
          errorBanner.classList.remove("hidden");
          errorBanner.classList.add("flex");
        } else {
          document.getElementById("reset-success-text").textContent = data.message;
          successBanner.classList.remove("hidden");
          successBanner.classList.add("flex");
          form.classList.add("hidden");
        }
      } catch (err) {
        console.error("Reset request failed:", err);
        document.getElementById("reset-error-text").textContent = "Network challenge encountered. Please try again.";
        errorBanner.classList.remove("hidden");
        errorBanner.classList.add("flex");
      } finally {
        document.getElementById("reset-submit-btn").disabled = false;
        document.getElementById("reset-submit-spinner").classList.add("hidden");
        document.getElementById("reset-submit-label").textContent = "Confirm New Password";
      }
    });
  })();
</script>
{% endblock %}
