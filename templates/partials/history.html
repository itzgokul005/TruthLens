<!--
  Port of src/components/HistorySection.tsx. The filters shelf is static;
  the ledger item list and the certificate detail panel are entirely
  derived from the `history` array + local filter/selection state, so
  they're rendered by static/js/main.js (renderLedgerList / renderCertificate).
-->
<div id="history-root-block" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <div class="mb-10">
    <h1 class="font-display text-4xl sm:text-5xl font-black tracking-tighter uppercase leading-none text-slate-900 dark:text-white">
      Audit <span class="text-blue-600">Ledger</span>.
    </h1>
    <p class="text-zinc-500 font-medium mt-2 text-xs sm:text-sm">
      Multi-modal Trust Ledger • Review, analyze, or export previously computed truth certificates and optical findings
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

    <!-- Left Side: history listing -->
    <div class="lg:col-span-7 space-y-4">

      <!-- Filters shelf -->
      <div class="rounded-2xl bg-white dark:bg-slate-850 border border-slate-200/60 dark:border-slate-800 p-4 shadow-sm space-y-3">

        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
            <i data-lucide="search" style="width:14px;height:14px"></i>
          </span>
          <input id="ledger-search-query-input" type="text" placeholder="Search audit summaries, verdicts, keywords..." class="w-full pl-9 pr-3 py-2 text-xs rounded-lg border border-slate-250/20 dark:border-slate-800 bg-white dark:bg-slate-900 focus:outline-none focus:ring-1 focus:ring-blue-500 text-slate-900 dark:text-white" />
        </div>

        <div class="flex flex-wrap gap-2 pt-1 items-center justify-between">

          <div class="flex gap-1.5 p-1 bg-slate-50 dark:bg-slate-900/65 rounded-lg border border-slate-150/50 dark:border-slate-850">
            <button id="filter-type-all" data-type-filter="all" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase transition bg-white dark:bg-slate-700 shadow-sm text-blue-600 dark:text-white">All Types</button>
            <button id="filter-type-text" data-type-filter="text" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase transition text-slate-500 dark:text-slate-400">Articles</button>
            <button id="filter-type-image" data-type-filter="image" class="px-2.5 py-1 rounded text-[10px] font-bold uppercase transition text-slate-500 dark:text-slate-400">Visuals</button>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            <span class="text-[10px] font-bold text-slate-400 uppercase">Rating:</span>
            <select id="ledger-rating-filter-select" class="px-2 py-1 text-[10px] sm:text-xs rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 focus:outline-none">
              <option value="all">All Verdicts</option>
              <option value="REAL">Credible</option>
              <option value="FAKE">False</option>
              <option value="MISLEADING">Misleading</option>
              <option value="SATIRE">Satire</option>
            </select>
          </div>

        </div>

      </div>

      <!-- List items (rendered by JS) -->
      <div class="space-y-3" id="ledger-items-list"></div>

    </div>

    <!-- Right Side: selected item full certificate output -->
    <div id="full-certificate-display-column" class="lg:col-span-5"></div>

  </div>

</div>
